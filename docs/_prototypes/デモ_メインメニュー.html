<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
body{margin:0;background:#5a6b7b;font-family:"Meiryo UI","Meiryo",sans-serif;font-size:12px}
.win{max-width:1000px;margin:20px auto;background:#f0f0f0;border:1px solid #2b2b2b}
.tb{height:30px;background:linear-gradient(#1a6fe0,#0a53be);color:#fff;display:flex;align-items:center;padding:0 8px}
.tb .t{flex:1}
.hd{display:flex;align-items:center;gap:12px;padding:7px 10px;border-bottom:1px solid #ccc}
.hd label{color:#606060}.ro{background:#eef0f2;border:1px solid;border-color:#7a7a7a #dcdcdc #dcdcdc #7a7a7a;padding:2px 6px;min-width:60px}
.hd .title{margin-left:auto;font-weight:bold;font-size:13px;color:#243b53}
.flow{display:flex;flex-wrap:wrap;gap:14px;padding:16px;align-items:flex-start}
fieldset{border:1px solid #b0b0b0;margin:0;padding:8px 10px 12px;min-width:236px}
legend{color:#c0158a;padding:0 6px}
button{display:block;width:210px;height:34px;margin:8px auto 0;background:#e9e9e9;border:1px solid #adadad;font:inherit;color:#111;cursor:pointer}
button:hover{background:#e5f1fb;border-color:#7eb4ea}
button.exit{height:40px;font-weight:bold}
.demoTag{position:fixed;top:8px;right:10px;background:#b23b3b;color:#fff;font-size:11px;padding:3px 8px}
</style></head><body>
<div class="demoTag">メニュー レイアウト確認（WinForms移行イメージ）</div>
<div class="win">
  <div class="tb"><span class="t">ATOM メインメニュー</span><span>▢ ✕</span></div>
  <div class="hd"><label>ログイン:</label><span class="ro">000001</span>
     <label>氏名:</label><span class="ro" style="min-width:110px">山田 太郎</span>
     <label>部門:</label><span class="ro" style="min-width:80px">輸入部</span>
     <span class="title">メインメニュー</span></div>
  <div class="flow">
    <fieldset><legend>上海輸入定期便＆AIR便</legend>
      <button>INVOICE取込</button><button>INVOICE確認</button><button>INVOICEヘッダー入力</button>
      <button>R3購買発注取込</button><button>R3購買発注確認</button><button>R3在庫転送作成</button><button>SAP伝票金額入力</button></fieldset>
    <fieldset><legend>その他輸入関連</legend>
      <button>調達R3購買発注取込</button><button>調達R3購買発注確認</button><button>調達配送手配書作成</button></fieldset>
    <fieldset><legend>マスタ関連</legend>
      <button>社内参照番号発番</button><button>項目マスタ</button><button>カレンダー</button>
      <button>仕入先マスタ登録</button><button>商品名称入力</button><button>経費コード登録</button></fieldset>
    <fieldset><legend>輸入経費入力</legend><button>諸経費入力</button></fieldset>
    <fieldset><legend>OTHERS</legend><button class="exit">終　了</button></fieldset>
  </div>
</div></body></html>
